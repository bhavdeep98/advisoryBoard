<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advisory Board Playground</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
        }

        /* Config Panel */
        .config-panel {
            width: 380px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .config-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0f3460;
        }
        .config-header h2 {
            color: #e94560;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .presets {
            padding: 12px 20px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .preset-btn {
            background: #0f3460;
            border: 1px solid #1a4080;
            color: #ccc;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover { background: #e94560; color: white; border-color: #e94560; }

        .agents-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .agent-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 14px;
            border-left: 4px solid #888;
            transition: all 0.2s;
        }
        .agent-card.disabled { opacity: 0.4; }
        .agent-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .agent-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .agent-role {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
        }
        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #333;
            border-radius: 20px;
            transition: 0.3s;
        }
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #e94560; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(16px); }

        .agent-prompt {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #1a4080;
            color: #ddd;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            resize: vertical;
            min-height: 60px;
            margin-top: 8px;
        }
        .agent-prompt:focus { outline: none; border-color: #e94560; }

        .agent-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }
        .agent-controls label { font-size: 10px; color: #888; }
        .agent-controls input[type="range"] { width: 80px; accent-color: #e94560; }
        .temp-val { font-size: 11px; color: #aaa; min-width: 24px; }

        /* Chat Panel */
        .chat-panel { flex: 1; display: flex; flex-direction: column; }
        .chat-header {
            padding: 14px 24px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h1 { font-size: 18px; }
        .header-actions { display: flex; gap: 8px; }
        .header-btn {
            background: transparent;
            border: 1px solid #0f3460;
            color: #aaa;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .header-btn:hover { border-color: #e94560; color: #e94560; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: #e94560;
            color: white;
            border-bottom-right-radius: 3px;
        }
        .message.agent {
            align-self: flex-start;
            background: #0f3460;
            border-bottom-left-radius: 3px;
        }
        .message.system {
            align-self: center;
            background: transparent;
            border: 1px dashed #555;
            color: #888;
            font-size: 12px;
            padding: 6px 14px;
        }
        .message .msg-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .message .msg-avatar { font-size: 14px; }

        /* Markdown in messages */
        .message p { margin: 0 0 6px 0; }
        .message p:last-child { margin: 0; }
        .message strong { color: #fff; }
        .message code {
            background: rgba(255,255,255,0.1);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 12px;
        }
        .message pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin: 6px 0; overflow-x: auto; }
        .message pre code { background: none; padding: 0; }
        .message ul, .message ol { padding-left: 18px; margin: 6px 0; }
        .message li { margin: 2px 0; }

        .typing {
            align-self: flex-start;
            padding: 10px 14px;
            background: #0f3460;
            border-radius: 10px;
            display: none;
        }
        .typing.visible { display: flex; align-items: center; gap: 8px; }
        .typing-name { font-size: 12px; color: #aaa; }
        .typing-dots span {
            display: inline-block;
            width: 6px; height: 6px;
            background: #e94560;
            border-radius: 50%;
            margin: 0 1px;
            animation: bounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .input-area {
            padding: 14px 24px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            background: #0f3460;
            border: 1px solid #1a4080;
            color: #eee;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        .input-area input:focus { outline: none; border-color: #e94560; }
        .input-area button {
            background: #e94560;
            border: none;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .input-area button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="config-panel">
        <div class="config-header">
            <h2>Advisory Board Config</h2>
        </div>
        <div class="presets">
            <button class="preset-btn" onclick="applyPreset('default')">Default Board</button>
            <button class="preset-btn" onclick="applyPreset('echo_chamber')">Echo Chamber</button>
            <button class="preset-btn" onclick="applyPreset('chaos')">Max Chaos</button>
            <button class="preset-btn" onclick="applyPreset('minimal')">Minimal</button>
        </div>
        <div class="agents-list" id="agentsList"></div>
    </div>

    <div class="chat-panel">
        <div class="chat-header">
            <h1>Advisory Board</h1>
            <div class="header-actions">
                <button class="header-btn" onclick="clearChat()">Clear</button>
            </div>
        </div>
        <div class="messages" id="messages">
            <div class="message system">Pitch an idea and your advisory board will debate it. Configure agents on the left.</div>
        </div>
        <div class="typing" id="typing">
            <span class="typing-name" id="typingName"></span>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Pitch an idea to your advisory board..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const sessionId = 'session-' + Date.now();
        let ws;
        let agents = [];

        marked.setOptions({ breaks: true, gfm: true });

        function connect() {
            ws = new WebSocket(`ws://${window.location.host}/ws/${sessionId}`);
            ws.onopen = () => {
                ws.send(JSON.stringify({ action: 'get_agents' }));
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            ws.onclose = () => {
                setTimeout(connect, 2000);
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'agents':
                    agents = data.agents;
                    renderAgentCards();
                    break;
                case 'user_message':
                    addChatMessage('user', data);
                    break;
                case 'agent_message':
                    hideTyping();
                    addChatMessage('agent', data);
                    break;
                case 'typing':
                    showTyping(data.name);
                    break;
                case 'round_complete':
                    hideTyping();
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('userInput').focus();
                    break;
                case 'agent_updated':
                    agents = data.agents;
                    renderAgentCards();
                    break;
                case 'cleared':
                    document.getElementById('messages').innerHTML = '<div class="message system">Conversation cleared.</div>';
                    break;
                case 'system':
                    addChatMessage('system', data);
                    break;
                case 'error':
                    hideTyping();
                    addChatMessage('system', { content: `${data.name}: ${data.content}` });
                    break;
            }
        }

        function renderAgentCards() {
            const list = document.getElementById('agentsList');
            list.innerHTML = agents.map((agent, i) => `
                <div class="agent-card ${agent.enabled ? '' : 'disabled'}" style="border-left-color: ${agent.color}" id="card-${i}">
                    <div class="agent-card-header">
                        <div>
                            <div class="agent-name">
                                <span class="msg-avatar">${agent.avatar}</span>
                                ${agent.name}
                            </div>
                            <div class="agent-role">${agent.role}</div>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" ${agent.enabled ? 'checked' : ''} onchange="toggleAgent('${agent.name}', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <textarea class="agent-prompt" onchange="updatePrompt('${agent.name}', this.value)">${agent.system_prompt}</textarea>
                    <div class="agent-controls">
                        <label>Temp:</label>
                        <input type="range" min="0" max="2" step="0.1" value="${agent.temperature}" onchange="updateTemp('${agent.name}', this.value)" oninput="this.nextElementSibling.textContent=this.value">
                        <span class="temp-val">${agent.temperature}</span>
                    </div>
                </div>
            `).join('');
        }

        function toggleAgent(name, enabled) {
            ws.send(JSON.stringify({ action: 'update_agent', name, updates: { enabled } }));
        }
        function updatePrompt(name, system_prompt) {
            ws.send(JSON.stringify({ action: 'update_agent', name, updates: { system_prompt } }));
        }
        function updateTemp(name, temperature) {
            ws.send(JSON.stringify({ action: 'update_agent', name, updates: { temperature: parseFloat(temperature) } }));
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message || !ws) return;
            ws.send(JSON.stringify({ action: 'chat', message }));
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
        }

        function addChatMessage(type, data) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message ${type}`;

            if (type === 'user') {
                div.innerHTML = `<div class="msg-header">You</div>${escapeHtml(data.content)}`;
            } else if (type === 'agent') {
                div.innerHTML = `
                    <div class="msg-header" style="color:${data.color}">
                        <span class="msg-avatar">${data.avatar}</span> ${data.name}
                    </div>
                    ${marked.parse(data.content)}`;
            } else {
                div.textContent = data.content;
            }

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping(name) {
            const el = document.getElementById('typing');
            document.getElementById('typingName').textContent = name + ' is thinking...';
            el.classList.add('visible');
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
        function hideTyping() {
            document.getElementById('typing').classList.remove('visible');
        }

        function clearChat() {
            if (ws) ws.send(JSON.stringify({ action: 'clear' }));
        }

        async function applyPreset(name) {
            const res = await fetch('/api/preset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, preset: name }),
            });
            const data = await res.json();
            if (data.agents) {
                agents = data.agents;
                renderAgentCards();
                document.getElementById('messages').innerHTML = `<div class="message system">Preset "${name}" applied. All agents reconfigured.</div>`;
            }
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        document.getElementById('userInput').focus();
        connect();
    </script>
</body>
</html>
